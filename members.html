<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Members — The E Chronicles</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="home-theme.css"/>
  <style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --bg2:#111118;
  --surface:#16161f;
  --surface2:#1e1e2a;
  --border:rgba(255,255,255,.07);
  --border-hover:rgba(255,255,255,.15);
  --text:#f0f0f5;
  --text2:#a8a8b8;
  --text3:#5c5c78;
  --accent:#8b5cf6;
  --accent2:#6d28d9;
  --accent-light:rgba(139,92,246,.12);
  --gold:#f59e0b;
  --gold-light:rgba(245,158,11,.12);
  --gold-glow:rgba(245,158,11,.25);
  --cyan:#38bdf8;
  --cyan-light:rgba(56,189,248,.12);
  --cyan-glow:rgba(56,189,248,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.4);
  --mesh:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(139,92,246,.15),transparent);
}
.page-hero{background:var(--surface);border-bottom:1px solid var(--border);padding:4rem 2.5rem 3.5rem;position:relative;overflow:hidden}
.page-hero::before{content:'';position:absolute;inset:0;background:var(--mesh);pointer-events:none}
.page-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.4),rgba(245,158,11,.3),transparent)}
.page-hero-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;position:relative;z-index:1}
.members-section{padding:3rem 2.5rem 6rem}
.members-inner{max-width:1200px;margin:0 auto}
.members-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:2.5rem}
.member-count-badge{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text3);letter-spacing:.12em;padding:.4rem .85rem;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.search-wrap{display:flex;align-items:center;gap:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.6rem 1rem;transition:border-color .2s,box-shadow .2s;flex:1;max-width:360px}
.search-wrap:focus-within{border-color:rgba(139,92,246,.5);box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.search-wrap svg{flex-shrink:0;color:var(--text3)}
.search-input{background:none;border:none;outline:none;font-family:'DM Mono',monospace;font-size:.78rem;color:var(--text);width:100%}
.search-input::placeholder{color:var(--text3)}

/* ── CARD GRID (Strictly 4 cards per row on laptop) ── */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.25rem}
@media (min-width: 992px){
  .members-grid{grid-template-columns:repeat(4,1fr)!important;gap:1.5rem}
}

.member-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .32s,border-color .25s;position:relative}
.member-card::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:0}

/* Regular Card Hover */
.member-card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:rgba(139,92,246,.7)!important;
  box-shadow:0 0 0 2px rgba(139,92,246,.6),0 16px 40px rgba(139,92,246,.35),var(--shadow-lg)!important;
}
.member-card:hover::before{opacity:1}

.mc-photo{width:100%;aspect-ratio:3/4;background:var(--bg2);overflow:hidden;position:relative}
.mc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s ease;display:block}
.member-card:hover .mc-photo img{transform:scale(1.08)}
.mc-photo-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,#1a1030 0%,#0d0d1a 100%)}
.mc-initials{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.mc-photo::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(6,5,15,.8) 0%,transparent 100%);z-index:1;pointer-events:none}
.mc-quote-overlay{position:absolute;inset:0;z-index:3;background:linear-gradient(160deg,rgba(109,40,217,.92) 0%,rgba(139,92,246,.88) 50%,rgba(245,158,11,.2) 100%);display:flex;align-items:center;justify-content:center;padding:1.25rem;opacity:0;transition:opacity .35s ease}
.member-card:hover .mc-quote-overlay{opacity:1}
.mc-quote-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.88rem;color:#fff;text-align:center;line-height:1.6}
.mc-badge{position:absolute;top:.65rem;right:.65rem;z-index:2;font-size:.6rem;font-weight:600;letter-spacing:.08em;padding:.22rem .55rem;border-radius:7px;font-family:'DM Mono',monospace}

/* ── CR CARD & BADGE (Neon Violet / Purple Star) ── */
.cr-card{
  border-color:rgba(168,85,247,.4)!important;
  background:linear-gradient(160deg,rgba(139,92,246,.08) 0%,var(--surface) 40%)!important;
}
.cr-card:hover{
  border-color:#c084fc!important;
  box-shadow:0 0 0 2px #c084fc,0 20px 50px rgba(168,85,247,.5),0 0 30px rgba(192,132,252,.35),var(--shadow-lg)!important;
}
.mc-badge-cr{
  color:#fff;
  border:1px solid rgba(192,132,252,.5);
  background:linear-gradient(135deg,#581c87 0%,#7c3aed 50%,#9333ea 100%);
  box-shadow:0 2px 14px rgba(168,85,247,.6),0 1px 3px rgba(0,0,0,.5);
}

/* ── CCR CARD & BADGE (Royal Gold Shimmer & Pulsing Glow) ── */
@keyframes goldShimmer{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}
@keyframes ccrPulse{
  0%,100%{box-shadow:0 2px 20px rgba(245,158,11,.7),0 0 40px rgba(245,158,11,.3),0 1px 3px rgba(0,0,0,.6)}
  50%{box-shadow:0 2px 28px rgba(245,158,11,1),0 0 60px rgba(245,158,11,.5),0 1px 3px rgba(0,0,0,.6)}
}
.ccr-card{
  border-color:rgba(245,158,11,.55)!important;
  background:linear-gradient(160deg,rgba(245,158,11,.1) 0%,var(--surface) 40%)!important;
}
.ccr-card:hover{
  border-color:#fbbf24!important;
  box-shadow:0 0 0 2px #fbbf24,0 20px 55px rgba(245,158,11,.6),0 0 35px rgba(251,191,36,.45),var(--shadow-lg)!important;
}
.mc-badge-ccr{
  color:#1a0800;
  font-weight:700;
  font-size:.62rem;
  letter-spacing:.1em;
  border:1px solid rgba(253,224,71,.7);
  background:linear-gradient(270deg,#92400e,#d97706,#fde047,#f59e0b,#fbbf24,#d97706,#92400e);
  background-size:300% 100%;
  animation:goldShimmer 3s linear infinite,ccrPulse 2.5s ease-in-out infinite;
  padding:.28rem .65rem;
  border-radius:8px;
}

/* ── MGMT CARD & BADGE (Cyber Sapphire / Cyan) ── */
.mgmt-card{
  border-color:rgba(56,189,248,.4)!important;
  background:linear-gradient(160deg,rgba(56,189,248,.08) 0%,var(--surface) 40%)!important;
}
.mgmt-card:hover{
  border-color:#38bdf8!important;
  box-shadow:0 0 0 2px #38bdf8,0 20px 50px rgba(56,189,248,.5),0 0 30px rgba(56,189,248,.35),var(--shadow-lg)!important;
}
.mc-badge-mgmt{
  color:#fff;
  border:1px solid rgba(56,189,248,.4);
  background:linear-gradient(135deg,#0c4a6e 0%,#0284c7 50%,#38bdf8 100%);
  box-shadow:0 2px 14px rgba(56,189,248,.5),0 1px 3px rgba(0,0,0,.4);
}

.mc-profile-dot{position:absolute;bottom:.65rem;left:.65rem;z-index:2;width:8px;height:8px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.mc-profile-dot.has-profile{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,.6)}
.mc-profile-dot.no-profile{background:#374151}

.mc-info{padding:1rem 1rem 1.1rem;position:relative;z-index:1}
.mc-roll{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--text3);letter-spacing:.15em;margin-bottom:.28rem;text-transform:uppercase}
.mc-name{font-size:.83rem;font-weight:600;line-height:1.3;color:var(--text)}
.mc-meta{display:flex;align-items:center;gap:.35rem;margin-top:.45rem;flex-wrap:wrap}
.mc-tag{display:inline-flex;align-items:center;gap:.2rem;font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.06em;text-transform:uppercase;padding:.12rem .44rem;border-radius:5px;white-space:nowrap}
.mc-tag-cr{background:var(--accent-light);color:var(--accent);border:1px solid rgba(139,92,246,.3)}
.mc-tag-ccr{background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(253,224,71,.15));color:#fde047;border:1px solid rgba(253,224,71,.4);font-weight:700}
.mc-tag-mgmt{background:var(--cyan-light);color:var(--cyan);border:1px solid rgba(56,189,248,.3)}
.mc-dob{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--text3);margin-top:.35rem;display:flex;align-items:center;gap:.3rem}

/* ══════════════════════════════════════════════════════════════
   DETAILED VIEW MODAL (Full Edge-to-Edge Image with Signature)
   ══════════════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(4,3,10,0.88);
  backdrop-filter:blur(14px);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  opacity:0;
  visibility:hidden;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.open{
  opacity:1;
  visibility:visible;
}

.modal-detailed-card{
  width:100%;
  max-width:880px;
  background:linear-gradient(135deg,rgba(22,17,38,0.98) 0%,rgba(11,8,20,0.99) 100%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,0.85);
  display:grid;
  grid-template-columns:380px 1fr;
  position:relative;
  max-height:88vh;
  transform:scale(0.95) translateY(12px);
  transition:transform 0.32s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.open .modal-detailed-card{
  transform:scale(1) translateY(0);
}

/* Modal theme borders */
.modal-detailed-card.is-ccr{border-color:rgba(251,191,36,0.5);box-shadow:0 30px 90px rgba(0,0,0,0.85),0 0 60px rgba(245,158,11,0.25)}
.modal-detailed-card.is-cr{border-color:rgba(192,132,252,0.5);box-shadow:0 30px 90px rgba(0,0,0,0.85),0 0 60px rgba(168,85,247,0.25)}
.modal-detailed-card.is-mgmt{border-color:rgba(56,189,248,0.5);box-shadow:0 30px 90px rgba(0,0,0,0.85),0 0 60px rgba(56,189,248,0.25)}

/* Left Pane: Fills the entire space edge-to-edge (0 empty borders!) */
.modal-left-pane{
  position:relative;
  background:#090712;
  overflow:hidden;
  min-height:500px;
  width:100%;
  height:100%;
}
.modal-left-photo{
  width:100%;
  height:100%;
  object-fit:cover; /* Edge-to-edge fill with NO empty borders */
  object-position:center top;
  display:block;
}

/* Gradient vignette over lower section of photo for signature readability */
.modal-left-pane::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:55%;
  background:linear-gradient(to top,rgba(11,8,20,0.92) 0%,rgba(11,8,20,0.4) 40%,transparent 100%);
  pointer-events:none;
  z-index:3;
}

/* Color-coded handwritten signature over bottom of image */
.modal-signature-wrap{
  position:absolute;
  bottom:24px;
  left:22px;
  right:22px;
  z-index:5;
  pointer-events:none;
}
.modal-signature-text{
  font-family:'Caveat',cursive;
  font-size:2.8rem;
  font-weight:700;
  line-height:1;
  color:#ffffff;
  text-shadow:0 2px 12px rgba(0,0,0,0.9);
  transform:rotate(-3.5deg);
  display:block;
}
.is-ccr .modal-signature-text{
  color:#fde047;
  text-shadow:0 2px 14px rgba(245,158,11,0.6),0 2px 4px #000;
}
.is-cr .modal-signature-text{
  color:#d8b4fe;
  text-shadow:0 2px 14px rgba(168,85,247,0.6),0 2px 4px #000;
}
.is-mgmt .modal-signature-text{
  color:#7dd3fc;
  text-shadow:0 2px 14px rgba(56,189,248,0.6),0 2px 4px #000;
}

/* Close button */
.modal-close-btn{
  position:absolute;
  top:18px;
  right:18px;
  z-index:20;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
  cursor:pointer;
  transition:all 0.2s ease;
  backdrop-filter:blur(10px);
}
.modal-close-btn:hover{
  background:rgba(255,255,255,0.22);
  transform:rotate(90deg);
}

/* Right Content Pane */
.modal-right-pane{
  padding:2.2rem 2.2rem 2.4rem;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:1.15rem;
}
.modal-right-pane::-webkit-scrollbar{width:5px}
.modal-right-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:10px}

.modal-header-meta{
  font-family:'DM Mono',monospace;
  font-size:0.7rem;
  letter-spacing:0.18em;
  color:var(--text3);
  text-transform:uppercase;
}
.is-ccr .modal-header-meta{color:rgba(251,191,36,0.85)}
.is-cr .modal-header-meta{color:rgba(192,132,252,0.85)}
.is-mgmt .modal-header-meta{color:rgba(56,189,248,0.85)}

.modal-person-name{
  font-family:'Cormorant Garamond',serif;
  font-size:2.2rem;
  font-weight:700;
  line-height:1.15;
  color:var(--text);
  margin:0.25rem 0 0.35rem;
}

.modal-role-pill{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  font-size:0.75rem;
  font-family:'DM Mono',monospace;
  color:var(--accent);
  padding:0.22rem 0.7rem;
  background:rgba(139,92,246,0.12);
  border:1px solid rgba(139,92,246,0.25);
  border-radius:8px;
  width:fit-content;
}
.is-ccr .modal-role-pill{color:#fde047;background:rgba(245,158,11,0.15);border-color:rgba(251,191,36,0.4)}
.is-cr .modal-role-pill{color:#e9d5ff;background:rgba(139,92,246,0.15);border-color:rgba(192,132,252,0.4)}
.is-mgmt .modal-role-pill{color:#7dd3fc;background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.4)}

/* Quote card */
.modal-quote-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-left:3px solid var(--accent);
  border-radius:0 14px 14px 0;
  padding:0.95rem 1.2rem;
}
.is-ccr .modal-quote-card{border-left-color:#fbbf24;background:rgba(245,158,11,0.04)}
.is-cr .modal-quote-card{border-left-color:#c084fc;background:rgba(139,92,246,0.04)}
.is-mgmt .modal-quote-card{border-left-color:#38bdf8;background:rgba(56,189,248,0.04)}
.modal-quote-text{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:1.05rem;
  color:var(--text2);
  line-height:1.6;
}

/* Stats grid */
.modal-stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.75rem;
}
.modal-stat-box{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:14px;
  padding:0.75rem 1rem;
  display:flex;
  align-items:center;
  gap:0.75rem;
}
.modal-stat-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(139,92,246,0.12);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.95rem;
  flex-shrink:0;
}
.is-ccr .modal-stat-icon{background:rgba(245,158,11,0.15);color:#fbbf24}
.is-cr .modal-stat-icon{background:rgba(139,92,246,0.15);color:#c084fc}
.is-mgmt .modal-stat-icon{background:rgba(56,189,248,0.15);color:#38bdf8}
.modal-stat-label{
  font-family:'DM Mono',monospace;
  font-size:0.6rem;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:0.1em;
}
.modal-stat-value{
  font-size:0.86rem;
  font-weight:600;
  color:var(--text);
  margin-top:0.15rem;
}

/* Section E Story */
.modal-story-box{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:1.1rem 1.25rem;
}
.modal-story-title{
  font-family:'DM Mono',monospace;
  font-size:0.65rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:0.5rem;
  display:flex;
  align-items:center;
  gap:0.4rem;
}
.is-ccr .modal-story-title{color:#fbbf24}
.is-cr .modal-story-title{color:#c084fc}
.is-mgmt .modal-story-title{color:#38bdf8}
.modal-story-text{
  font-size:0.88rem;
  color:var(--text2);
  line-height:1.7;
}

/* ── MOBILE MODAL (Edge-to-edge top photo + safe scroll) ── */
@media(max-width:768px){
  .members-section{padding:2rem 1.25rem 4rem}
  .page-hero{padding:2.75rem 1.25rem 2.25rem}
  .members-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.9rem}

  .modal-overlay{
    padding:0;
    align-items:flex-end;
  }
  .modal-detailed-card{
    grid-template-columns:1fr;
    max-height:94vh;
    border-radius:28px 28px 0 0;
    transform:translateY(100%);
    border-bottom:none;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
  }
  .modal-overlay.open .modal-detailed-card{
    transform:translateY(0);
  }

  .modal-left-pane{
    min-height:300px;
    height:320px;
    width:100%;
    flex-shrink:0;
  }
  .modal-left-photo{
    width:100%;
    height:100%;
    object-fit:cover; /* Fills edge to edge without empty borders */
    object-position:center top;
  }
  .modal-signature-wrap{
    bottom:14px;
    left:16px;
    right:16px;
  }
  .modal-signature-text{
    font-size:2.2rem;
  }

  .modal-right-pane{
    padding:1.4rem 1.25rem 4.5rem;
    gap:1rem;
    overflow-y:visible;
  }
  .modal-person-name{
    font-size:1.65rem;
  }
  .modal-stats-grid{
    grid-template-columns:1fr;
    gap:0.6rem;
  }
}

@media(max-width:400px){
  .members-grid{grid-template-columns:repeat(2,1fr);gap:.7rem}
}
</style>
</head>
<body>
<div class="page">
  <div class="page-hero">
    <div class="page-hero-inner reveal">
      <div>
        <div class="section-label">// The people</div>
        <h1 class="section-title" style="margin-bottom:0">Members</h1>
        <p class="section-desc" style="margin-top:.5rem">All 56 students of Section E — St. Xavier's College, Science Biology, Batch 2025–2027.</p>
      </div>
    </div>
  </div>
  <section class="members-section">
    <div class="members-inner">
      <div class="members-toolbar reveal">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search by name or roll number…"/>
        </div>
        <div class="member-count-badge" id="countLabel">56 students</div>
      </div>
      <div class="members-grid reveal reveal-delay-1" id="membersGrid"></div>
    </div>
  </section>
</div>

<!-- LATEST DETAILED VIEW MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-detailed-card" id="modalCard">
    <button class="modal-close-btn" id="modalClose">✕</button>
    <div class="modal-left-pane">
      <img src="" alt="" class="modal-left-photo" id="modalPhoto"
        onerror="this.style.display='none';document.getElementById('modalInitialsBox').style.display='flex';"/>
      <div class="mc-photo-placeholder" id="modalInitialsBox" style="display:none">
        <div class="mc-initials" id="modalInitials"></div>
      </div>
      <div class="modal-signature-wrap">
        <div class="modal-signature-text" id="modalSignature"></div>
      </div>
    </div>
    <div class="modal-right-pane" id="modalContent">
      <!-- Injected via JS -->
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
<script src="shared.js"></script>
<script>
injectNav();

// Proper Title Casing: Never whole in lowercase
function toTitle(str){
  if(!str) return '';
  return str.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : '').join(' ');
}

function getInitials(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('');
}

function renderGrid(filter=''){
  const grid = document.getElementById('membersGrid');
  const f = filter.toLowerCase().trim();
  const filtered = STUDENTS.filter(s => !f || s.name.toLowerCase().includes(f) || String(s.roll).includes(f));
  document.getElementById('countLabel').textContent = `${filtered.length} student${filtered.length !== 1 ? 's' : ''}`;
  if(!filtered.length){
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--text3);font-family:Cormorant Garamond,serif;font-style:italic;font-size:1.15rem">No students found matching your search.</div>';
    return;
  }
  grid.innerHTML = filtered.map(s => {
    const initials = getInitials(s.name);
    const title = toTitle(s.name);
    const p = STUDENT_PROFILES[s.roll];
    const hasProfile = !!p;
    const wantsMgmt = p && p.wantsManagement;
    const quote = p && p.quote ? p.quote : '';
    const photoSrc = getDriveFolderPhotoUrl(s.roll, _memberPhotos);

    // Color code card classes
    let cardClass = '';
    if(s.ccr) cardClass = 'ccr-card';
    else if(s.cr) cardClass = 'cr-card';
    else if(wantsMgmt) cardClass = 'mgmt-card';

    // Badge: CCR > CR > MGMT
    let badge = '';
    if(s.ccr) badge = `<div class="mc-badge mc-badge-ccr">👑 CCR</div>`;
    else if(s.cr) badge = `<div class="mc-badge mc-badge-cr">★ CR</div>`;
    else if(wantsMgmt) badge = `<div class="mc-badge mc-badge-mgmt">⚡ MGMT</div>`;

    // Tag below name
    let tag = '';
    if(s.ccr) tag = `<span class="mc-tag mc-tag-ccr">👑 ${s.crTitle||'Chief CR'}</span>`;
    else if(s.cr) tag = `<span class="mc-tag mc-tag-cr">★ ${s.crTitle||'Class Rep'}</span>`;
    else if(wantsMgmt) tag = '<span class="mc-tag mc-tag-mgmt">⚡ Mgmt</span>';

    return `
    <div class="member-card ${cardClass}" onclick="openModal(${s.roll})">
      <div class="mc-photo">
        <img src="${photoSrc}" alt="${title}"
          onerror="this.parentElement.innerHTML='<div class=mc-photo-placeholder><div class=mc-initials>${initials}</div></div>'"
          loading="lazy"/>
        ${badge}
        <div class="mc-profile-dot ${hasProfile?'has-profile':'no-profile'}"></div>
        ${quote?`<div class="mc-quote-overlay"><div class="mc-quote-text">${quote.length>80?quote.substring(0,80)+'…':quote}</div></div>`:''}
      </div>
      <div class="mc-info">
        <div class="mc-roll">#${s.roll}</div>
        <div class="mc-name">${title}</div>
        <div class="mc-meta">${tag}</div>
        ${(p&&p.dob&&p.dob.bsDay)?`<div class="mc-dob">🎂 ${p.dob.monthName} ${p.dob.bsDay}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openModal(roll){
  const s = STUDENTS.find(s => s.roll === roll);
  if(!s) return;
  const title = toTitle(s.name);
  const initials = getInitials(s.name);
  const p = STUDENT_PROFILES[s.roll];
  const photoSrc = getDriveFolderPhotoUrl(roll, _memberPhotos);

  const isCCR = !!s.ccr;
  const isCR = !isCCR && !!s.cr;
  const isMGMT = !isCCR && !isCR && (p && p.wantsManagement);

  const cardElem = document.getElementById('modalCard');
  cardElem.className = 'modal-detailed-card' + (isCCR ? ' is-ccr' : isCR ? ' is-cr' : isMGMT ? ' is-mgmt' : '');

  // Photo & Signature setup
  const photoEl = document.getElementById('modalPhoto');
  const initBox = document.getElementById('modalInitialsBox');

  photoEl.style.display = 'block';
  initBox.style.display = 'none';
  photoEl.src = photoSrc;
  document.getElementById('modalInitials').textContent = initials;
  document.getElementById('modalSignature').textContent = title;

  // Breadcrumb & Role
  let roleCategory = 'MEMBER';
  let roleTitle = 'Student';
  if(isCCR){ roleCategory = 'CCR'; roleTitle = s.crTitle || 'Chief Class Representative'; }
  else if(isCR){ roleCategory = 'CR'; roleTitle = s.crTitle || 'Class Representative'; }
  else if(isMGMT){ roleCategory = 'MGMT'; roleTitle = 'Management Team'; }

  // Birthday formatted
  let dobStr = '—';
  if(p && p.dob){
    const d = p.dob;
    dobStr = d.bsDay ? `${d.monthName} ${d.bsDay}, ${d.bsYear} BS` : `${d.monthName} ${d.bsYear} BS`;
  }

  // Quote
  const quote = (p && p.quote) ? p.quote : '“Dream big, work hard, and make every moment count.”';

  // Section E Story
  const storyText = (p && p.experience) 
    ? p.experience 
    : "A proud member of St. Xavier's College Section E, sharing in the academic journey, lively discussions, and unforgettable batch memories.";

  document.getElementById('modalContent').innerHTML = `
    <div>
      <div class="modal-header-meta">SECTION E • ${roleCategory}</div>
      <div class="modal-person-name">${title}</div>
      <div class="modal-role-pill">${isCCR ? '👑' : isCR ? '★' : isMGMT ? '⚡' : '✦'} ${roleTitle}</div>
    </div>

    <div class="modal-quote-card">
      <div class="modal-quote-text">“ ${quote.replace(/^[“"']+|[”"']+$/g, '')} ”</div>
    </div>

    <div class="modal-stats-grid">
      <div class="modal-stat-box">
        <div class="modal-stat-icon">#</div>
        <div>
          <div class="modal-stat-label">Roll Number</div>
          <div class="modal-stat-value">${s.roll}</div>
        </div>
      </div>
      <div class="modal-stat-box">
        <div class="modal-stat-icon">🎂</div>
        <div>
          <div class="modal-stat-label">Birthday (BS)</div>
          <div class="modal-stat-value">${dobStr}</div>
        </div>
      </div>
    </div>

    <div class="modal-story-box">
      <div class="modal-story-title">✦ Their Section E Story</div>
      <div class="modal-story-text">${storyText}</div>
    </div>

    ${(p && p.email) ? `
    <div style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--text3);display:flex;align-items:center;gap:0.4rem;padding:0.2rem 0">
      ✉️ ${p.email}
    </div>` : ''}
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

document.getElementById('searchInput').addEventListener('input', e => renderGrid(e.target.value));

let _memberPhotos = {};
(async function init(){
  try {
    const siteData = await loadSiteData();
    _memberPhotos = siteData.memberPhotos || {};
  } catch(err){
    console.error('Data load fallback', err);
  }
  renderGrid();
})();

window.addEventListener('ec-data-updated', e => {
  _memberPhotos = (e.detail.data || {}).memberPhotos || {};
  renderGrid(document.getElementById('searchInput')?.value || '');
});
</script>
</body>
</html>
