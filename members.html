<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Members — The E Chronicles</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="home-theme.css"/>
  <style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#07060d;
  --bg2:#0f0d1a;
  --surface:#131122;
  --surface2:#1a172e;
  --surface-glass:rgba(19,17,34,0.72);
  --border:rgba(255,255,255,0.08);
  --border-hover:rgba(168,85,247,0.4);
  --text:#f8f8fc;
  --text2:#b4b4c7;
  --text3:#6d6b82;
  --accent:#a855f7;
  --accent-glow:rgba(168,85,247,0.35);
  --gold:#f59e0b;
  --gold-glow:rgba(245,158,11,0.4);
  --cyan:#38bdf8;
  --cyan-glow:rgba(56,189,248,0.35);
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  margin:0;
  padding:0;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── HERO BANNER ── */
.page-hero{
  background:radial-gradient(ellipse 90% 60% at 50% -20%,rgba(124,58,237,0.22),transparent 75%),var(--bg);
  border-bottom:1px solid var(--border);
  padding:4rem 2rem 3rem;
  position:relative;
  overflow:hidden;
}
.page-hero-inner{
  max-width:1240px;
  margin:0 auto;
  position:relative;
  z-index:2;
}
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:0.75rem;
  letter-spacing:0.18em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:0.5rem;
}
.section-title{
  font-family:'Fraunces',serif;
  font-size:clamp(2.4rem,5vw,3.8rem);
  font-weight:700;
  letter-spacing:-0.02em;
  margin:0;
  background:linear-gradient(135deg,#ffffff 40%,#d8b4fe 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.section-desc{
  color:var(--text2);
  font-size:0.95rem;
  max-width:600px;
  margin-top:0.6rem;
  line-height:1.6;
}

/* ── ROLE SHOWCASE BADGES ── */
.role-pills-bar{
  display:flex;
  align-items:center;
  gap:1rem;
  margin-top:1.8rem;
  flex-wrap:wrap;
}
.role-pill-item{
  display:inline-flex;
  align-items:center;
  gap:0.65rem;
  padding:0.45rem 1rem;
  border-radius:100px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  font-size:0.8rem;
  backdrop-filter:blur(8px);
}
.role-pill-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  font-weight:700;
  letter-spacing:0.08em;
  padding:0.2rem 0.55rem;
  border-radius:100px;
  display:inline-flex;
  align-items:center;
  gap:0.25rem;
}
.role-pill-motto{
  font-family:'Fraunces',serif;
  font-style:italic;
  color:var(--text2);
  font-size:0.82rem;
}

.pill-ccr .role-pill-badge{background:linear-gradient(135deg,#78350f,#d97706);color:#fef3c7;border:1px solid rgba(251,191,36,0.5);box-shadow:0 0 12px rgba(245,158,11,0.35)}
.pill-ccr .role-pill-motto{color:#fde68a}
.pill-cr .role-pill-badge{background:linear-gradient(135deg,#581c87,#9333ea);color:#f3e8ff;border:1px solid rgba(192,132,252,0.4);box-shadow:0 0 12px rgba(168,85,247,0.35)}
.pill-cr .role-pill-motto{color:#e9d5ff}
.pill-mgmt .role-pill-badge{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#e0f2fe;border:1px solid rgba(56,189,248,0.4);box-shadow:0 0 12px rgba(56,189,248,0.35)}
.pill-mgmt .role-pill-motto{color:#bae6fd}

/* ── MAIN CONTENT ── */
.members-section{
  padding:2.5rem 2rem 6rem;
  max-width:1280px;
  margin:0 auto;
}
.members-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1.2rem;
  margin-bottom:2.2rem;
  flex-wrap:wrap;
}
.search-wrap{
  display:flex;
  align-items:center;
  gap:0.75rem;
  background:rgba(22,18,38,0.85);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;
  padding:0.7rem 1.1rem;
  flex:1;
  max-width:400px;
  transition:all 0.25s ease;
  backdrop-filter:blur(10px);
}
.search-wrap:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(168,85,247,0.2),0 0 25px rgba(168,85,247,0.15);
}
.search-input{
  background:none;
  border:none;
  outline:none;
  font-family:'Space Grotesk',sans-serif;
  font-size:0.85rem;
  color:#fff;
  width:100%;
}
.search-input::placeholder{color:var(--text3)}
.member-count-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  color:var(--text2);
  letter-spacing:0.12em;
  padding:0.45rem 1rem;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:100px;
}

/* ── GRID SYSTEM ── */
.members-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:1.8rem;
}

/* ── CARD DESIGN ── */
.member-card{
  background:linear-gradient(180deg,rgba(26,20,44,0.85) 0%,rgba(13,10,22,0.96) 100%);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1),box-shadow 0.4s ease,border-color 0.4s ease;
  display:flex;
  flex-direction:column;
  box-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.member-card:hover{
  transform:translateY(-8px);
  border-color:rgba(168,85,247,0.7);
  box-shadow:0 0 0 2px rgba(168,85,247,0.8),0 20px 50px rgba(168,85,247,0.35),0 0 30px rgba(168,85,247,0.2);
}

/* ── SPECIAL CCR CARD (Imperial Gold) ── */
.member-card.is-ccr{
  border-color:rgba(245,158,11,0.4);
  background:linear-gradient(180deg,rgba(40,24,10,0.85) 0%,rgba(18,12,6,0.96) 100%);
}
.member-card.is-ccr:hover{
  border-color:#fbbf24;
  box-shadow:0 0 0 2px #fbbf24,0 20px 60px rgba(245,158,11,0.5),0 0 40px rgba(245,158,11,0.3);
}

/* ── SPECIAL CR CARD (Neon Purple Star) ── */
.member-card.is-cr{
  border-color:rgba(192,132,252,0.35);
}
.member-card.is-cr:hover{
  border-color:#c084fc;
  box-shadow:0 0 0 2px #c084fc,0 20px 55px rgba(192,132,252,0.45),0 0 35px rgba(168,85,247,0.25);
}

/* ── SPECIAL MGMT CARD (Cyber Sapphire) ── */
.member-card.is-mgmt{
  border-color:rgba(56,189,248,0.35);
  background:linear-gradient(180deg,rgba(12,28,48,0.85) 0%,rgba(8,14,24,0.96) 100%);
}
.member-card.is-mgmt:hover{
  border-color:#38bdf8;
  box-shadow:0 0 0 2px #38bdf8,0 20px 55px rgba(56,189,248,0.45),0 0 35px rgba(56,189,248,0.25);
}

/* Card Photo Zone */
.card-photo-box{
  width:100%;
  aspect-ratio:3/3.8;
  position:relative;
  overflow:hidden;
  background:#0a0812;
}
.card-photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  transition:transform 0.6s cubic-bezier(0.16,1,0.3,1);
  display:block;
}
.member-card:hover .card-photo-box img{
  transform:scale(1.06);
}

/* Natural vignette gradient over photo bottom */
.card-photo-box::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(13,10,22,0.95) 0%,rgba(13,10,22,0.4) 40%,transparent 80%);
  pointer-events:none;
}

/* Top Right Watermark Emblem (CCR Crown, CR Star, MGMT Gear) */
.card-emblem{
  position:absolute;
  top:14px;
  right:14px;
  z-index:3;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(10,8,18,0.65);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.12);
  pointer-events:none;
  transition:all 0.3s ease;
}
.card-emblem svg{width:20px;height:20px}
.is-ccr .card-emblem{border-color:rgba(251,191,36,0.45);box-shadow:0 0 15px rgba(245,158,11,0.35);color:#fbbf24}
.is-cr .card-emblem{border-color:rgba(192,132,252,0.4);box-shadow:0 0 15px rgba(168,85,247,0.3);color:#c084fc}
.is-mgmt .card-emblem{border-color:rgba(56,189,248,0.4);box-shadow:0 0 15px rgba(56,189,248,0.3);color:#38bdf8}

/* Hover Quote Overlay */
.card-hover-quote-overlay{
  position:absolute;
  inset:0;
  z-index:4;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.4rem;
  opacity:0;
  visibility:hidden;
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
  background:radial-gradient(circle at center,rgba(18,14,32,0.85) 0%,rgba(10,8,18,0.92) 100%);
  backdrop-filter:blur(10px);
}
.member-card:hover .card-hover-quote-overlay{
  opacity:1;
  visibility:visible;
}
.card-hover-quote-bubble{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;
  padding:1.1rem 1.2rem;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,0.6);
  max-width:100%;
}
.is-ccr .card-hover-quote-bubble{border-color:rgba(251,191,36,0.3);box-shadow:0 0 25px rgba(245,158,11,0.2)}
.is-cr .card-hover-quote-bubble{border-color:rgba(192,132,252,0.3);box-shadow:0 0 25px rgba(168,85,247,0.2)}
.is-mgmt .card-hover-quote-bubble{border-color:rgba(56,189,248,0.3);box-shadow:0 0 25px rgba(56,189,248,0.2)}
.card-hover-quote-mark{
  font-size:1.4rem;
  line-height:1;
  margin-bottom:0.4rem;
  display:inline-block;
  color:var(--accent);
}
.is-ccr .card-hover-quote-mark{color:#fbbf24}
.is-cr .card-hover-quote-mark{color:#c084fc}
.is-mgmt .card-hover-quote-mark{color:#38bdf8}
.card-hover-quote-text{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:0.9rem;
  line-height:1.55;
  color:#f1f0f7;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* Fallback Initials Placeholder */
.photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 30%,#26194a 0%,#0c0918 100%);
}
.photo-initials{
  font-family:'Fraunces',serif;
  font-size:3.2rem;
  font-weight:700;
  background:linear-gradient(135deg,#c084fc,#fbbf24);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Card Body Info */
.card-body{
  padding:1.1rem 1.2rem 1.3rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
  margin-top:-0.5rem;
}
.card-name{
  font-family:'Fraunces',serif;
  font-size:1.15rem;
  font-weight:700;
  color:#ffffff;
  margin-bottom:0.5rem;
  letter-spacing:-0.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
}
.card-role-sub{
  font-size:0.7rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:0.55rem;
  font-family:'JetBrains Mono',monospace;
}
.is-ccr .card-role-sub{color:#fde047;font-weight:700}
.is-cr .card-role-sub{color:#d8b4fe}
.is-mgmt .card-role-sub{color:#7dd3fc}

.card-pills-row{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.4rem;
  width:100%;
}
.pill-roll{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:100px;
  padding:0.22rem 0.9rem;
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;
  font-weight:600;
  color:var(--text2);
  letter-spacing:0.05em;
}
.is-ccr .pill-roll{background:rgba(245,158,11,0.12);border-color:rgba(251,191,36,0.3);color:#fde68a}
.is-cr .pill-roll{background:rgba(168,85,247,0.12);border-color:rgba(192,132,252,0.3);color:#e9d5ff}
.is-mgmt .pill-roll{background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.3);color:#bae6fd}

.pill-birthday{
  display:inline-flex;
  align-items:center;
  gap:0.35rem;
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;
  color:var(--text3);
}

/* Himalayan mountain silhouette reflection bottom */
.card-mountain-deco{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:40px;
  background-image:radial-gradient(ellipse 80% 100% at 50% 120%,rgba(168,85,247,0.18),transparent);
  pointer-events:none;
}
.is-ccr .card-mountain-deco{background-image:radial-gradient(ellipse 80% 100% at 50% 120%,rgba(245,158,11,0.22),transparent)}
.is-cr .card-mountain-deco{background-image:radial-gradient(ellipse 80% 100% at 50% 120%,rgba(192,132,252,0.22),transparent)}
.is-mgmt .card-mountain-deco{background-image:radial-gradient(ellipse 80% 100% at 50% 120%,rgba(56,189,248,0.22),transparent)}

/* ════════════════════════════════════════════════
   DETAILED MODAL (Desktop & Tablet)
   ════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(4,3,10,0.88);
  backdrop-filter:blur(14px);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  opacity:0;
  visibility:hidden;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.open{
  opacity:1;
  visibility:visible;
}

.modal-detailed-card{
  width:100%;
  max-width:880px;
  background:linear-gradient(135deg,rgba(22,17,38,0.95) 0%,rgba(11,8,20,0.98) 100%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,0.8),0 0 60px rgba(168,85,247,0.18);
  display:grid;
  grid-template-columns:360px 1fr;
  position:relative;
  max-height:88vh;
  transform:scale(0.94) translateY(15px);
  transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.open .modal-detailed-card{
  transform:scale(1) translateY(0);
}

.modal-detailed-card.is-ccr{border-color:rgba(251,191,36,0.45);box-shadow:0 30px 90px rgba(0,0,0,0.8),0 0 70px rgba(245,158,11,0.25)}
.modal-detailed-card.is-cr{border-color:rgba(192,132,252,0.45);box-shadow:0 30px 90px rgba(0,0,0,0.8),0 0 70px rgba(168,85,247,0.25)}
.modal-detailed-card.is-mgmt{border-color:rgba(56,189,248,0.45);box-shadow:0 30px 90px rgba(0,0,0,0.8),0 0 70px rgba(56,189,248,0.25)}

/* Left Photo Pane with Signature */
.modal-left-pane{
  position:relative;
  background:#090712;
  overflow:hidden;
  min-height:480px;
}
.modal-left-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
}
.modal-left-pane::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(11,8,20,0.95) 0%,rgba(11,8,20,0.3) 45%,transparent 80%);
  pointer-events:none;
}
.modal-signature-wrap{
  position:absolute;
  bottom:24px;
  left:24px;
  right:24px;
  z-index:3;
  pointer-events:none;
}
.modal-signature-text{
  font-family:'Caveat',cursive;
  font-size:2.8rem;
  font-weight:700;
  line-height:1;
  color:#ffffff;
  text-shadow:0 2px 12px rgba(0,0,0,0.9);
  opacity:0.92;
  transform:rotate(-4deg);
}
.is-ccr .modal-signature-text{color:#fde047}
.is-cr .modal-signature-text{color:#e9d5ff}
.is-mgmt .modal-signature-text{color:#bae6fd}

/* Right Content Pane */
.modal-right-pane{
  padding:2.2rem 2.2rem 2.4rem;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:1.2rem;
}
.modal-right-pane::-webkit-scrollbar{width:5px}
.modal-right-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:10px}

.modal-close-btn{
  position:absolute;
  top:20px;
  right:20px;
  z-index:10;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  cursor:pointer;
  transition:all 0.2s ease;
  backdrop-filter:blur(8px);
}
.modal-close-btn:hover{
  background:rgba(255,255,255,0.2);
  transform:rotate(90deg);
}

.modal-header-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:0.72rem;
  letter-spacing:0.18em;
  color:var(--text3);
  text-transform:uppercase;
}
.modal-person-name{
  font-family:'Fraunces',serif;
  font-size:2.2rem;
  font-weight:700;
  line-height:1.15;
  color:#ffffff;
  margin:0.2rem 0 0.1rem;
}
.modal-role-pill{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  font-size:0.75rem;
  font-family:'JetBrains Mono',monospace;
  color:var(--accent);
  padding:0.2rem 0.65rem;
  background:rgba(168,85,247,0.12);
  border:1px solid rgba(168,85,247,0.25);
  border-radius:8px;
  width:fit-content;
}
.is-ccr .modal-role-pill{color:#fde047;background:rgba(245,158,11,0.15);border-color:rgba(251,191,36,0.35)}
.is-cr .modal-role-pill{color:#e9d5ff;background:rgba(168,85,247,0.15);border-color:rgba(192,132,252,0.35)}
.is-mgmt .modal-role-pill{color:#7dd3fc;background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.35)}

/* Modal Quote Card */
.modal-quote-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-left:3px solid var(--accent);
  border-radius:0 16px 16px 0;
  padding:1rem 1.25rem;
}
.is-ccr .modal-quote-card{border-left-color:#fbbf24;background:rgba(245,158,11,0.04)}
.is-cr .modal-quote-card{border-left-color:#c084fc;background:rgba(168,85,247,0.04)}
.is-mgmt .modal-quote-card{border-left-color:#38bdf8;background:rgba(56,189,248,0.04)}
.modal-quote-text{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:1.05rem;
  color:#f3f2fa;
  line-height:1.6;
}

/* Modal Info Grid (Roll & Birthday) */
.modal-stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.8rem;
}
.modal-stat-box{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:14px;
  padding:0.75rem 1rem;
  display:flex;
  align-items:center;
  gap:0.75rem;
}
.modal-stat-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(168,85,247,0.12);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.95rem;
  flex-shrink:0;
}
.is-ccr .modal-stat-icon{background:rgba(245,158,11,0.15);color:#fbbf24}
.is-cr .modal-stat-icon{background:rgba(168,85,247,0.15);color:#c084fc}
.is-mgmt .modal-stat-icon{background:rgba(56,189,248,0.15);color:#38bdf8}
.modal-stat-label{
  font-family:'JetBrains Mono',monospace;
  font-size:0.6rem;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:0.1em;
}
.modal-stat-value{
  font-size:0.88rem;
  font-weight:600;
  color:#ffffff;
  margin-top:0.15rem;
}

/* Their Section E Story Section */
.modal-story-box{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:1.1rem 1.25rem;
}
.modal-story-title{
  font-family:'JetBrains Mono',monospace;
  font-size:0.65rem;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:0.5rem;
  display:flex;
  align-items:center;
  gap:0.4rem;
}
.is-ccr .modal-story-title{color:#fbbf24}
.is-cr .modal-story-title{color:#c084fc}
.is-mgmt .modal-story-title{color:#38bdf8}
.modal-story-text{
  font-size:0.88rem;
  color:var(--text2);
  line-height:1.7;
}

/* ════════════════════════════════════════════════
   MOBILE VIEW (Matches phone mockup in reference)
   ════════════════════════════════════════════════ */
@media(max-width:768px){
  .page-hero{padding:2.8rem 1.25rem 2rem}
  .members-section{padding:1.5rem 1rem 4rem}
  .members-grid{
    grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
    gap:1rem;
  }
  .card-photo-box{aspect-ratio:3/3.8}
  .card-name{font-size:0.95rem;margin-bottom:0.35rem}
  .card-body{padding:0.85rem 0.75rem 1rem}
  .pill-roll{font-size:0.62rem;padding:0.18rem 0.65rem}
  .pill-birthday{font-size:0.58rem}

  /* Full-bleed bottom sheet modal on mobile */
  .modal-overlay{
    padding:0;
    align-items:flex-end;
  }
  .modal-detailed-card{
    grid-template-columns:1fr;
    max-height:92vh;
    border-radius:28px 28px 0 0;
    transform:translateY(100%);
    border-bottom:none;
  }
  .modal-overlay.open .modal-detailed-card{
    transform:translateY(0);
  }
  .modal-left-pane{
    min-height:260px;
    max-height:280px;
  }
  .modal-signature-text{
    font-size:2.2rem;
  }
  .modal-right-pane{
    padding:1.4rem 1.25rem 2rem;
    gap:1rem;
  }
  .modal-person-name{
    font-size:1.6rem;
  }
  .modal-stats-grid{
    grid-template-columns:1fr;
    gap:0.6rem;
  }
}

@media(max-width:380px){
  .members-grid{
    grid-template-columns:repeat(2,1fr);
    gap:0.75rem;
  }
}
  </style>
</head>
<body>

<div class="page">
  <!-- Top Hero -->
  <div class="page-hero">
    <div class="page-hero-inner">
      <div class="section-label">// The People of Section E</div>
      <h1 class="section-title">Members</h1>
      <p class="section-desc">All 56 students of Section E — St. Xavier's College, Science Biology, Batch 2025–2027.</p>
      
      <!-- Role Bar -->
      <div class="role-pills-bar">
        <div class="role-pill-item pill-ccr">
          <span class="role-pill-badge">👑 CCR</span>
          <span class="role-pill-motto">Lead with Vision</span>
        </div>
        <div class="role-pill-item pill-cr">
          <span class="role-pill-badge">★ CR</span>
          <span class="role-pill-motto">Represent with Pride</span>
        </div>
        <div class="role-pill-item pill-mgmt">
          <span class="role-pill-badge">⚡ MGMT</span>
          <span class="role-pill-motto">Manage with Purpose</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Members List Section -->
  <section class="members-section">
    <div class="members-toolbar">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search by name or roll number…"/>
      </div>
      <div class="member-count-badge" id="countLabel">56 students</div>
    </div>

    <!-- Cards Grid -->
    <div class="members-grid" id="membersGrid"></div>
  </section>
</div>

<!-- DETAILED MODAL (Desktop split card & Mobile bottom sheet) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-detailed-card" id="modalCard">
    <button class="modal-close-btn" id="modalClose">✕</button>
    <div class="modal-left-pane">
      <img src="" alt="" class="modal-left-photo" id="modalPhoto"
        onerror="this.style.display='none';document.getElementById('modalInitialsBox').style.display='flex';"/>
      <div class="photo-placeholder" id="modalInitialsBox" style="display:none">
        <div class="photo-initials" id="modalInitials"></div>
      </div>
      <div class="modal-signature-wrap">
        <div class="modal-signature-text" id="modalSignature"></div>
      </div>
    </div>
    <div class="modal-right-pane" id="modalRightContent">
      <!-- Injected via JS -->
    </div>
  </div>
</div>

<!-- Firebase & Site Dependencies -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
<script src="shared.js"></script>

<script>
injectNav();

function toTitle(str){
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function getInitials(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('');
}

let _memberPhotos = {};

function renderGrid(filter=''){
  const grid = document.getElementById('membersGrid');
  const f = filter.toLowerCase().trim();
  const filtered = STUDENTS.filter(s => !f || s.name.toLowerCase().includes(f) || String(s.roll).includes(f));
  
  document.getElementById('countLabel').textContent = `${filtered.length} student${filtered.length !== 1 ? 's' : ''}`;
  
  if(!filtered.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--text3);font-family:Fraunces,serif;font-style:italic;font-size:1.2rem">No students found matching your search.</div>';
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const initials = getInitials(s.name);
    const title = toTitle(s.name);
    const p = STUDENT_PROFILES[s.roll];
    const isCCR = !!s.ccr;
    const isCR = !isCCR && !!s.cr;
    const isMGMT = !isCCR && !isCR && (p && p.wantsManagement);
    
    // Determine card class
    let cardClass = '';
    if(isCCR) cardClass = 'is-ccr';
    else if(isCR) cardClass = 'is-cr';
    else if(isMGMT) cardClass = 'is-mgmt';

    // Emblem Watermark Icon
    let emblemHtml = '';
    if(isCCR){
      emblemHtml = `<div class="card-emblem" title="Chief Class Representative"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg></div>`;
    } else if(isCR){
      emblemHtml = `<div class="card-emblem" title="Class Representative"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"/></svg></div>`;
    } else if(isMGMT){
      emblemHtml = `<div class="card-emblem" title="Management Team"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 4.9 5.2.4-3.9 3.5 1.2 5.1-4.1-3.2-4.1 3.2 1.2-5.1-3.9-3.5 5.2-.4z"/></svg></div>`;
    }

    // Role subtitle
    let roleSub = '';
    if(isCCR) roleSub = `<div class="card-role-sub">👑 Chief CR · Lead with Vision</div>`;
    else if(isCR) roleSub = `<div class="card-role-sub">★ Class Rep · Represent with Pride</div>`;
    else if(isMGMT) roleSub = `<div class="card-role-sub">⚡ Management Team</div>`;

    // Quote
    const quote = (p && p.quote) ? p.quote : (p && p.experience ? p.experience.slice(0, 90) + '…' : 'Learning, leading & making memories in Section E.');

    // Birthday
    let bdayText = '';
    if(p && p.dob){
      const d = p.dob;
      bdayText = d.bsDay ? `${d.monthName} ${d.bsDay}` : `${d.monthName}`;
    }

    const photoSrc = getDriveFolderPhotoUrl(s.roll, _memberPhotos);

    return `
    <div class="member-card ${cardClass}" onclick="openModal(${s.roll})">
      <div class="card-photo-box">
        <img src="${photoSrc}" alt="${title}" loading="lazy"
          onerror="this.parentElement.innerHTML='<div class=photo-placeholder><div class=photo-initials>${initials}</div></div>'"/>
        ${emblemHtml}
        <div class="card-hover-quote-overlay">
          <div class="card-hover-quote-bubble">
            <span class="card-hover-quote-mark">❝</span>
            <div class="card-hover-quote-text">${quote}</div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${title}</div>
        ${roleSub}
        <div class="card-pills-row">
          <div class="pill-roll">Roll No. ${s.roll}</div>
          ${bdayText ? `<div class="pill-birthday">🎂 ${bdayText}</div>` : ''}
        </div>
      </div>
      <div class="card-mountain-deco"></div>
    </div>`;
  }).join('');
}

function openModal(roll){
  const s = STUDENTS.find(x => x.roll === roll);
  if(!s) return;
  const p = STUDENT_PROFILES[s.roll];
  const title = toTitle(s.name);
  const initials = getInitials(s.name);
  const photoSrc = getDriveFolderPhotoUrl(roll, _memberPhotos);

  const isCCR = !!s.ccr;
  const isCR = !isCCR && !!s.cr;
  const isMGMT = !isCCR && !isCR && (p && p.wantsManagement);

  const cardElem = document.getElementById('modalCard');
  cardElem.className = 'modal-detailed-card' + (isCCR ? ' is-ccr' : isCR ? ' is-cr' : isMGMT ? ' is-mgmt' : '');

  // Photo & Signature
  const photoEl = document.getElementById('modalPhoto');
  const initBox = document.getElementById('modalInitialsBox');
  photoEl.style.display = 'block';
  initBox.style.display = 'none';
  photoEl.src = photoSrc;
  document.getElementById('modalInitials').textContent = initials;
  document.getElementById('modalSignature').textContent = title;

  // Breadcrumb
  let roleCategory = 'MEMBER';
  let roleTitle = 'Student';
  if(isCCR){ roleCategory = 'CCR'; roleTitle = s.crTitle || 'Chief Class Representative'; }
  else if(isCR){ roleCategory = 'CR'; roleTitle = s.crTitle || 'Class Representative'; }
  else if(isMGMT){ roleCategory = 'MGMT'; roleTitle = 'Management Team'; }

  // Birthday formatted
  let dobStr = '—';
  if(p && p.dob){
    const d = p.dob;
    dobStr = d.bsDay ? `${d.monthName} ${d.bsDay}, ${d.bsYear} BS` : `${d.monthName} ${d.bsYear} BS`;
  }

  // Quote
  const quote = (p && p.quote) ? p.quote : '“Dream big, work hard, and make every moment count.”';

  // Section E Story (Restored)
  const storyText = (p && p.experience) 
    ? p.experience 
    : "A proud member of St. Xavier's College Section E, sharing in the academic journey, lively discussions, and unforgettable batch memories.";

  document.getElementById('modalRightContent').innerHTML = `
    <div>
      <div class="modal-header-meta">SECTION E • ${roleCategory}</div>
      <div class="modal-person-name">${title}</div>
      <div class="modal-role-pill">${isCCR ? '👑' : isCR ? '★' : isMGMT ? '⚡' : '✦'} ${roleTitle}</div>
    </div>

    <div class="modal-quote-card">
      <div class="modal-quote-text">“ ${quote.replace(/^[“"']+|[”"']+$/g, '')} ”</div>
    </div>

    <div class="modal-stats-grid">
      <div class="modal-stat-box">
        <div class="modal-stat-icon">#</div>
        <div>
          <div class="modal-stat-label">Roll Number</div>
          <div class="modal-stat-value">${s.roll}</div>
        </div>
      </div>
      <div class="modal-stat-box">
        <div class="modal-stat-icon">🎂</div>
        <div>
          <div class="modal-stat-label">Birthday (BS)</div>
          <div class="modal-stat-value">${dobStr}</div>
        </div>
      </div>
    </div>

    <div class="modal-story-box">
      <div class="modal-story-title">✦ Their Section E Story</div>
      <div class="modal-story-text">${storyText}</div>
    </div>

    ${(p && p.email) ? `
    <div style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text3);display:flex;align-items:center;gap:0.4rem;padding:0.4rem 0">
      ✉️ ${p.email}
    </div>` : ''}
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

document.getElementById('searchInput').addEventListener('input', e => renderGrid(e.target.value));

(async function init(){
  try {
    const siteData = await loadSiteData();
    _memberPhotos = siteData.memberPhotos || {};
  } catch(err){
    console.error('Data load fallback', err);
  }
  renderGrid();
})();

window.addEventListener('ec-data-updated', e => {
  _memberPhotos = (e.detail.data || {}).memberPhotos || {};
  renderGrid(document.getElementById('searchInput')?.value || '');
});
</script>
</body>
</html>
