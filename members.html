<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
  <title>Members — The E Chronicles</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="home-theme.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      /* LIGHT THEME */
      --mb-bg: #f7f5ef;
      --mb-surface: #ffffff;
      --mb-surface-dock: rgba(255, 255, 255, 0.85);
      --mb-border: rgba(0, 0, 0, 0.08);
      --mb-border-hover: rgba(0, 0, 0, 0.18);
      --mb-text: #1b1814;
      --mb-text-sub: #6c6457;
      --mb-text-muted: #968c7e;
      --mb-pill-bg: #eae5d8;
      --mb-accent: #7c3aed;
      --mb-gold: #d97706;
      --mb-gold-glow: rgba(217, 119, 6, 0.25);
      --mb-shadow: 0 12px 30px -8px rgba(30, 24, 16, 0.12), 0 4px 10px rgba(0, 0, 0, 0.04);
      --mb-hero-bg: linear-gradient(180deg, #f0ece0 0%, var(--mb-bg) 100%);
    }

    html.dark {
      /* GALAXY COSMIC DARK THEME */
      --mb-bg: #090a12;
      --mb-surface: #121422;
      --mb-surface-dock: rgba(18, 20, 34, 0.88);
      --mb-border: rgba(255, 255, 255, 0.08);
      --mb-border-hover: rgba(139, 92, 246, 0.35);
      --mb-text: #f4f3ef;
      --mb-text-sub: #9ea4bc;
      --mb-text-muted: #5e6480;
      --mb-pill-bg: #181b2e;
      --mb-accent: #a78bfa;
      --mb-gold: #f59e0b;
      --mb-gold-glow: rgba(245, 158, 11, 0.35);
      --mb-shadow: 0 18px 45px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(109, 40, 217, 0.12);
      --mb-hero-bg: linear-gradient(180deg, #101222 0%, var(--mb-bg) 100%);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--mb-bg);
      color: var(--mb-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background 0.35s ease, color 0.35s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── PAGE HERO ─── */
    .page-hero {
      background: var(--mb-hero-bg);
      border-bottom: 1px solid var(--mb-border);
      padding: 3.5rem 2.5rem 2.8rem;
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 30%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-hero-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      position: relative;
      z-index: 2;
    }
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mb-accent);
      margin-bottom: 0.4rem;
    }
    .hero-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--mb-text) 55%, var(--mb-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 0.92rem;
      color: var(--mb-text-sub);
      margin-top: 0.5rem;
      max-width: 620px;
      line-height: 1.55;
    }

    /* ─── TOOLBAR & SEARCH DOCK ─── */
    .members-section {
      padding: 2.5rem 2rem 6rem;
    }
    .members-inner {
      max-width: 1300px;
      margin: 0 auto;
    }
    .members-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 2.2rem;
    }

    /* Search bar with clear button */
    .search-box-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--mb-surface);
      border: 1px solid var(--mb-border);
      border-radius: 100px;
      padding: 0.65rem 1.2rem;
      flex: 1;
      max-width: 380px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
    }
    .search-box-wrap:focus-within {
      border-color: var(--mb-accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
    }
    .search-box-wrap svg {
      color: var(--mb-text-muted);
      flex-shrink: 0;
    }
    .search-input {
      background: none;
      border: none;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--mb-text);
      width: 100%;
    }
    .search-input::placeholder { color: var(--mb-text-muted); }
    .search-clear-btn {
      background: none;
      border: none;
      color: var(--mb-text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: none;
      padding: 0;
    }

    /* Filter pills */
    .filter-track {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--mb-pill-bg);
      padding: 4px;
      border-radius: 100px;
      border: 1px solid var(--mb-border);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-track::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: transparent;
      border: none;
      padding: 0.42rem 0.95rem;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--mb-text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .filter-chip:hover { color: var(--mb-text); }
    .filter-chip.active {
      background: var(--mb-surface);
      color: var(--mb-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .count-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--mb-text-sub);
      background: var(--mb-surface);
      border: 1px solid var(--mb-border);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* ══════════════════════════════════════════════════════
       CARD GRID & COLLECTOR PASS CARDS
       ══════════════════════════════════════════════════════ */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.4rem;
    }

    .member-card {
      position: relative;
      background: var(--mb-surface);
      border: 1px solid var(--mb-border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, border-color 0.28s ease;
      box-shadow: var(--mb-shadow);
      display: flex;
      flex-direction: column;
    }
    .member-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--mb-border-hover);
    }
    .member-card:active {
      transform: scale(0.98);
    }

    /* ─── CARD PHOTO CONTAINER ─── */
    .mc-photo-box {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #0f111c;
      overflow: hidden;
      position: relative;
    }
    .mc-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.4s ease;
    }
    .member-card:hover .mc-photo-box img {
      transform: scale(1.06);
    }

    /* Subtle bottom gradient so name info is readable */
    .mc-photo-box::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(to top, rgba(10, 11, 20, 0.75) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Placeholder Initials */
    .mc-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a162b 0%, #0d0f1a 100%);
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--mb-gold);
    }

    /* ─── LUXURY BADGES (Top of Card) ─── */
    .mc-badge-dock {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      right: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
      pointer-events: none;
    }
    .mc-roll-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.05em;
    }

    /* CCR Luxury Radiant Badge */
    @keyframes ccrShine {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    .badge-ccr {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #241302;
      background: linear-gradient(270deg, #d97706, #fde047, #f59e0b, #fde047, #d97706);
      background-size: 300% 100%;
      animation: ccrShine 3s linear infinite;
      padding: 0.25rem 0.65rem;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 3px 12px rgba(245, 158, 11, 0.65);
    }
    /* CR Gilded Badge */
    .badge-cr {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #b45309 0%, #d97706 60%, #f59e0b 100%);
      padding: 0.22rem 0.6rem;
      border-radius: 7px;
      border: 1px solid rgba(251, 191, 36, 0.4);
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.45);
    }
    /* MGMT Ultraviolet Badge */
    .badge-mgmt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      border: 1px solid rgba(167, 139, 250, 0.4);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4);
    }

    /* ─── CCR / CR CARD BORDER HIGHLIGHTS ─── */
    .card-ccr {
      border-color: rgba(245, 158, 11, 0.6) !important;
      box-shadow: 0 16px 45px -8px rgba(245, 158, 11, 0.25), 0 0 0 1px rgba(245, 158, 11, 0.3) !important;
    }
    .card-ccr:hover {
      border-color: #f59e0b !important;
      box-shadow: 0 20px 50px -5px rgba(245, 158, 11, 0.4), 0 0 30px rgba(245, 158, 11, 0.25) !important;
    }
    .card-cr {
      border-color: rgba(217, 119, 6, 0.4) !important;
    }
    .card-cr:hover {
      border-color: rgba(245, 158, 11, 0.7) !important;
      box-shadow: 0 18px 45px -8px rgba(217, 119, 6, 0.3) !important;
    }

    /* Quote bottom peek on hover */
    .mc-quote-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 16, 28, 0.92);
      backdrop-filter: blur(10px);
      padding: 0.65rem 0.85rem;
      z-index: 2;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .member-card:hover .mc-quote-dock {
      transform: translateY(0);
    }
    .mc-quote-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      color: #f4efe6;
      line-height: 1.4;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ─── CARD INFO DOCK (Bottom) ─── */
    .mc-info {
      padding: 0.95rem 1rem 1.1rem;
      background: var(--mb-surface-dock);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .mc-name {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--mb-text);
      margin-bottom: 0.35rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mc-sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-top: 0.35rem;
    }
    .mc-tag-role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mb-text-sub);
    }
    .mc-story-indicator {
      font-size: 0.68rem;
      color: var(--mb-accent);
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
    }

    /* ══════════════════════════════════════════════════════
       OPTIMIZED MOBILE STYLING (≤ 768px)
       ══════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .page-hero {
        padding: 2.2rem 1.25rem 1.6rem;
      }
      .members-section {
        padding: 1.5rem 1rem 4.5rem;
      }
      .members-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.85rem;
        margin-bottom: 1.6rem;
      }
      .search-box-wrap {
        max-width: 100%;
        width: 100%;
        box-sizing: border-box;
      }
      .filter-track {
        width: 100%;
        box-sizing: border-box;
        padding: 5px;
      }
      .filter-chip {
        padding: 0.38rem 0.85rem;
        font-size: 0.74rem;
      }

      /* 2-Column Responsive Layout */
      .members-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.85rem;
      }
      .member-card {
        border-radius: 14px;
      }
      .member-card:hover {
        transform: none; /* No hover jumping on phone */
      }
      .mc-photo-box {
        aspect-ratio: 1 / 1.18;
      }
      .mc-info {
        padding: 0.75rem 0.8rem 0.9rem;
      }
      .mc-name {
        font-size: 0.82rem;
        margin-bottom: 0.2rem;
      }
      .mc-roll-pill {
        font-size: 0.58rem;
        padding: 0.15rem 0.45rem;
      }
      .badge-ccr, .badge-cr, .badge-mgmt {
        font-size: 0.56rem;
        padding: 0.18rem 0.5rem;
      }
      /* Hide hover quote strip on mobile touch, it shows inside modal */
      .mc-quote-dock {
        display: none;
      }
    }

    /* ══════════════════════════════════════════════════════
       MODAL & MOBILE BOTTOM-SHEET DRAWER
       ══════════════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 7, 14, 0.88);
      backdrop-filter: blur(10px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      position: relative;
      background: var(--mb-surface);
      border: 1px solid var(--mb-border);
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      transform: translateY(20px) scale(0.97);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-shimmer-bar {
      height: 3px;
      background: linear-gradient(90deg, var(--mb-accent), var(--mb-gold), var(--mb-accent));
      background-size: 200% 100%;
      animation: ccrShine 3s linear infinite;
    }

    .modal-scroll-body {
      overflow-y: auto;
      padding: 1.6rem 1.6rem 2.2rem;
      -webkit-overflow-scrolling: touch;
    }
    .modal-scroll-body::-webkit-scrollbar { width: 4px; }
    .modal-scroll-body::-webkit-scrollbar-thumb { background: var(--mb-border-hover); border-radius: 4px; }

    .modal-close-btn {
      position: absolute;
      top: 1.1rem;
      right: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--mb-border);
      background: var(--mb-pill-bg);
      color: var(--mb-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      z-index: 10;
      transition: background 0.2s;
    }
    .modal-close-btn:hover { background: var(--mb-border-hover); }

    .modal-head {
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
      margin-bottom: 1.3rem;
    }
    .modal-avatar {
      width: 90px;
      height: 114px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f111c;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .modal-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    .modal-head-meta {
      flex: 1;
      min-width: 0;
      padding-right: 1.5rem;
    }
    .modal-roll-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--mb-accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .modal-student-name {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--mb-text);
      margin-bottom: 0.5rem;
    }

    /* Modal Quote Callout */
    .modal-quote-box {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.08) 0%, rgba(245, 158, 11, 0.05) 100%);
      border-left: 3px solid var(--mb-gold);
      border-radius: 0 12px 12px 0;
      padding: 0.95rem 1.15rem;
      margin: 1.1rem 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--mb-text);
      line-height: 1.6;
    }

    /* Story Box */
    .modal-story-box {
      background: var(--mb-pill-bg);
      border: 1px solid var(--mb-border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin: 1.1rem 0;
      font-size: 0.88rem;
      color: var(--mb-text-sub);
      line-height: 1.65;
    }
    .modal-story-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--mb-text-muted);
      margin-bottom: 0.45rem;
    }

    /* Info Grid */
    .modal-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .modal-info-tile {
      background: var(--mb-pill-bg);
      border: 1px solid var(--mb-border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
    }
    .modal-info-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--mb-text-muted);
      margin-bottom: 0.25rem;
    }
    .modal-info-val {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--mb-text);
      word-break: break-all;
    }

    /* Bottom-sheet drawer on mobile */
    @media (max-width: 600px) {
      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }
      .modal-card {
        max-width: 100%;
        max-height: 84vh;
        border-radius: 22px 22px 0 0;
        transform: translateY(100%);
      }
      .modal-overlay.open .modal-card {
        transform: translateY(0);
      }
      /* Mobile Swipe Handle */
      .mobile-sheet-handle {
        width: 44px;
        height: 4px;
        background: var(--mb-border-hover);
        border-radius: 10px;
        margin: 10px auto 4px auto;
      }
    }
  </style>
</head>

<body>
<div class="page">
  <!-- Page Hero Header -->
  <header class="page-hero">
    <div class="page-hero-inner reveal">
      <div>
        <div class="section-label">// Class Roll & Profiles</div>
        <h1 class="hero-title">Section E Roster</h1>
        <p class="hero-desc">All 56 students of Section E — St. Xavier's College, Science Biology, Batch 2025–2027.</p>
      </div>
      <div class="count-indicator" id="countBadge">56 Members</div>
    </div>
  </header>

  <!-- Members Wall & Filter Dock -->
  <section class="members-section">
    <div class="members-inner">
      <div class="members-toolbar">
        <!-- Search bar -->
        <div class="search-box-wrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search by name, roll (#501), or title…" autocomplete="off"/>
          <button class="search-clear-btn" id="searchClear">✕</button>
        </div>

        <!-- Touch-Swipe Filter Chips -->
        <div class="filter-track" id="filterTrack">
          <button class="filter-chip active" data-filter="all">All (56)</button>
          <button class="filter-chip" data-filter="cr">👑 Leadership</button>
          <button class="filter-chip" data-filter="stories">✦ Stories & Bios</button>
          <button class="filter-chip" data-filter="mgmt">⚡ Management</button>
          <button class="filter-chip" data-filter="birthdays">🎂 Birthdays</button>
        </div>
      </div>

      <!-- Member Cards Grid -->
      <div class="members-grid" id="membersGrid"></div>
    </div>
  </section>
</div>

<!-- Modal / Mobile Bottom-Sheet -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="mobile-sheet-handle"></div>
    <div class="modal-shimmer-bar"></div>
    <button class="modal-close-btn" id="modalClose">✕</button>
    <div class="modal-scroll-body" id="modalContent"></div>
  </div>
</div>

<!-- Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
<script src="shared.js"></script>

<script>
// Mount standard site navigation
if (typeof injectNav === 'function') injectNav();

function toTitle(str) {
  return (str || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function getInitials(name) {
  const parts = (name || '').trim().split(/\s+/);
  return parts.slice(0, 2).map(p => p[0]).join('').toUpperCase();
}

let activeFilter = 'all';
let searchQuery = '';
let _memberPhotos = {};

function renderGrid() {
  const grid = document.getElementById('membersGrid');
  const countBadge = document.getElementById('countBadge');
  const q = searchQuery.toLowerCase().trim();

  const filtered = STUDENTS.filter(s => {
    // 1. Text Search matching
    const matchSearch = !q || 
      s.name.toLowerCase().includes(q) || 
      String(s.roll).includes(q) ||
      (s.crTitle && s.crTitle.toLowerCase().includes(q));

    if (!matchSearch) return false;

    // 2. Filter Category matching
    const p = STUDENT_PROFILES[s.roll];
    if (activeFilter === 'cr') return s.cr || s.ccr;
    if (activeFilter === 'stories') return p && (p.quote || p.experience);
    if (activeFilter === 'mgmt') return p && p.wantsManagement;
    if (activeFilter === 'birthdays') return p && p.dob && p.dob.bsDay;
    return true;
  });

  countBadge.textContent = `${filtered.length} Member${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    grid.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:5rem 1rem; color:var(--mb-text-sub); font-family:'Cormorant Garamond',serif; font-size:1.25rem; font-style:italic;">
        No Section E members found matching your search.
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const initials = getInitials(s.name);
    const titleName = toTitle(s.name);
    const p = STUDENT_PROFILES[s.roll];
    const quote = p && p.quote ? p.quote : '';
    const hasStory = p && p.experience;
    const wantsMgmt = p && p.wantsManagement;
    const photoSrc = getDriveFolderPhotoUrl(s.roll, _memberPhotos);

    // Card highlight class
    let cardClass = '';
    if (s.ccr) cardClass = 'card-ccr';
    else if (s.cr) cardClass = 'card-cr';

    // Top Right Badge
    let badgeHtml = '';
    if (s.ccr) badgeHtml = '<div class="badge-ccr">👑 CCR</div>';
    else if (s.cr) badgeHtml = '<div class="badge-cr">★ CR</div>';
    else if (wantsMgmt) badgeHtml = '<div class="badge-mgmt">⚡ MGMT</div>';

    // Role text
    let roleText = 'Student';
    if (s.ccr) roleText = s.crTitle || 'Chief CR';
    else if (s.cr) roleText = s.crTitle || 'Class Rep';
    else if (wantsMgmt) roleText = 'Management Team';

    return `
      <div class="member-card ${cardClass}" onclick="openModal(${s.roll})">
        <div class="mc-photo-box">
          <div class="mc-badge-dock">
            <span class="mc-roll-pill">#${s.roll}</span>
            ${badgeHtml}
          </div>

          <img src="${photoSrc}" alt="${titleName}" loading="lazy" decoding="async"
               onerror="this.parentElement.innerHTML='<div class=mc-placeholder>${initials}</div>'"/>

          ${quote ? `
            <div class="mc-quote-dock">
              <div class="mc-quote-text">"${quote}"</div>
            </div>` : ''}
        </div>

        <div class="mc-info">
          <div class="mc-name">${titleName}</div>
          <div class="mc-sub-row">
            <span class="mc-tag-role">${roleText}</span>
            ${hasStory ? '<span class="mc-story-indicator">✦ Story</span>' : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ─── MODAL OPENING & BOTTOM SHEET ───
function openModal(roll) {
  const s = STUDENTS.find(item => item.roll === roll);
  if (!s) return;

  const titleName = toTitle(s.name);
  const initials = getInitials(s.name);
  const p = STUDENT_PROFILES[s.roll];
  const photoSrc = getDriveFolderPhotoUrl(roll, _memberPhotos);

  let dobStr = '—';
  if (p && p.dob) {
    const d = p.dob;
    dobStr = d.bsDay ? `${d.monthName} ${d.bsDay}, ${d.bsYear} BS` : `${d.monthName} ${d.bsYear} BS`;
  }

  let roleBadges = '';
  if (s.ccr) roleBadges += '<span class="badge-ccr" style="margin-right:6px">👑 ' + (s.crTitle || 'Chief CR') + '</span>';
  else if (s.cr) roleBadges += '<span class="badge-cr" style="margin-right:6px">★ ' + (s.crTitle || 'Class Rep') + '</span>';
  if (p && p.wantsManagement) roleBadges += '<span class="badge-mgmt">⚡ Management Team</span>';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-head">
      <div class="modal-avatar">
        <img src="${photoSrc}" alt="${titleName}"
             onerror="this.parentElement.innerHTML='<div class=mc-placeholder style=font-size:1.8rem>${initials}</div>'"/>
      </div>
      <div class="modal-head-meta">
        <div class="modal-roll-tag">Roll No. ${s.roll} • Section E</div>
        <div class="modal-student-name">${titleName}</div>
        <div>${roleBadges}</div>
      </div>
    </div>

    ${p && p.quote ? `
      <div class="modal-quote-box">
        "${p.quote}"
      </div>` : ''}

    ${p && p.experience ? `
      <div class="modal-story-box">
        <div class="modal-story-title">✦ Section E Journey & Memory</div>
        <div>${p.experience}</div>
      </div>` : ''}

    <div class="modal-details-grid">
      <div class="modal-info-tile">
        <div class="modal-info-lbl">🎂 Birthday (BS)</div>
        <div class="modal-info-val">${dobStr}</div>
      </div>
      <div class="modal-info-tile">
        <div class="modal-info-lbl">✉️ Contact Email</div>
        <div class="modal-info-val" style="font-size:0.75rem">${(p && p.email) ? p.email : '—'}</div>
      </div>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ─── SEARCH & FILTER LOGIC ───
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  searchClear.style.display = searchQuery ? 'block' : 'none';
  renderGrid();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.style.display = 'none';
  renderGrid();
});

document.getElementById('filterTrack').addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  renderGrid();
});

// ─── INITIALIZATION ───
(async function init() {
  try {
    const siteData = typeof loadSiteData === 'function' ? await loadSiteData() : {};
    _memberPhotos = siteData.memberPhotos || {};
  } catch (err) {
    console.warn('Failed loading member photos from database', err);
  }
  renderGrid();
})();

window.addEventListener('ec-data-updated', (e) => {
  _memberPhotos = (e.detail.data || {}).memberPhotos || {};
  renderGrid();
});
</script>
</body>
</html>
